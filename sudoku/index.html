<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1650">
<title>Sudoku · Fliperama Bugado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="../shared/base.css?v=2609242000">
<style>
:root{
  --peer:#EEE4FF; --same:#FFC9E0;
  /* tamanho do tabuleiro: cabe na largura E na altura do celular
     (344px = barra + balão + status + ferramentas + teclado + espaços) */
  --bw:max(250px, min(calc(100vw - 28px), 520px, calc(100dvh - 344px)));
}
.wrap{padding-block:8px 16px}
/* celular: barra e balão em cima, ferramentas + números embaixo (no alcance do dedão),
   e o tabuleiro centralizado no espaço que sobra, em vez de um buraco no fim da tela */
.game{display:grid;gap:8px;min-height:100vh;min-height:100dvh;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"bar" "mascot" "board" "tools" "pad";justify-items:center}
#bar{grid-area:bar;width:100%}
#mascot{grid-area:mascot;width:var(--bw)}
.board-wrap{grid-area:board;align-self:center;width:var(--bw);position:relative;display:flex;flex-direction:column;gap:6px}
.tools{grid-area:tools;width:var(--bw)}
.pad{grid-area:pad;width:var(--bw)}
/* balão com altura mínima de 4 linhas: quase nenhuma fala muda o tamanho dele.
   Fala muito longa (dica) cresce um tico, mas as ferramentas e os números ficam presos embaixo */
#mascot .bg-bubble{min-height:80px;max-height:116px;padding:6px 12px}
#mascot .bg-bubble p{max-height:98px;overflow-y:auto;font-size:14px;line-height:1.25;scrollbar-width:none}
#mascot .bg-bubble p::-webkit-scrollbar{display:none}
#mascot .bg-bubble p.long{font-size:12.5px;line-height:1.22}

/* status */
.status{display:flex;align-items:center;gap:8px;min-height:28px}
.timer{font-family:var(--chunky);font-size:18px;color:var(--sun);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.paused{color:var(--muted)}
.combo{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--ink);background:var(--pink);border:2.5px solid var(--ink);border-radius:8px;padding:0 7px;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--ink)}
.hearts{margin-left:auto;display:flex;gap:2px}
.hearts svg{width:22px;height:22px}
.hearts path{fill:var(--pink);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transition:fill .3s}
.hearts .lost path{fill:#3d2a66}
.hearts .crack{display:none;fill:none!important;stroke:var(--ink)}
.hearts .lost .crack{display:inline}

/* tabuleiro */
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:4px;background:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--pink)}
.box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:var(--line);border-radius:7px;overflow:hidden;min-width:0;min-height:0}
.cell{appearance:none;border:0;margin:0;padding:0;min-width:0;min-height:0;background:var(--paper);color:var(--ink);font-family:var(--chunky);font-size:calc(var(--bw) * .066);line-height:1;display:grid;place-items:center;cursor:pointer;position:relative;transition:background-color .12s}
.cell.user{color:var(--violet)}
.cell.hinted{color:#0B8A81}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sun);box-shadow:inset 0 0 0 3px var(--ink);z-index:1}
.cell.err{background:var(--red);color:#fff}
.cell:focus-visible{outline:3px solid var(--pink);outline-offset:-3px;z-index:2}
.notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;padding:6%;font-family:var(--body);font-weight:900;font-size:calc(var(--bw) * .031);color:#62508F;place-items:center}
.notes i{font-style:normal;line-height:1;padding:0 1px}
.notes i.hl{color:#fff;background:var(--pink);border-radius:3px}
.floatxp{position:absolute;pointer-events:none;z-index:6;font-family:var(--chunky);font-size:17px;color:var(--cyan);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%)}
.paused-veil{position:absolute;inset:34px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;background:rgba(42,22,80,.82);border-radius:18px;z-index:4;font-family:var(--display);font-size:34px;letter-spacing:.05em;color:var(--sun);text-shadow:3px 3px 0 var(--pink);cursor:pointer;text-align:center;line-height:1}
.paused-veil small{display:block;font-family:var(--body);font-size:14px;color:var(--paper);text-shadow:none;letter-spacing:0;margin-top:6px}

/* ferramentas + teclado numérico */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
/* ícone + nome sempre (iniciante não adivinha o que é a borrachinha) */
.tool{position:relative;height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;line-height:1;padding:0 4px;border-radius:12px}
.tool span{white-space:nowrap}
.tool svg{flex:none;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--sun)}
.tool.hint{background:var(--cyan)}
.tool .tag{position:absolute;top:-9px;right:-5px;font-family:var(--chunky);font-size:11px;line-height:1.1;background:var(--ink);color:var(--sun);border-radius:99px;padding:1px 6px;border:2px solid var(--sun)}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.num{position:relative;height:58px;min-width:0;padding:0;display:grid;place-items:center;font-size:26px;line-height:1;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.num small{position:absolute;right:3px;bottom:3px;font-family:var(--body);font-weight:900;font-size:12px;color:#7A67A8;line-height:1}
.num.done{opacity:.3;box-shadow:0 0 0 var(--ink);transform:translateY(3px)}
.pad.notes-mode .num{background:#FFF1B8;font-size:19px}
.pad.notes-mode .num::after{content:"";position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--violet)}

@media (max-width:374px){ .tool{font-size:12px} .num small{right:2px;bottom:2px} }
/* celular baixinho: aperta um pouco pra o tabuleiro não ficar minúsculo */
@media (max-height:700px) and (max-width:879px){ :root{--bw:max(250px, min(calc(100vw - 28px), 520px, calc(100dvh - 316px)))} .tool{height:48px;flex-direction:row;gap:5px} .tool span{display:none} .num{height:50px} #mascot .bg-bubble{min-height:68px} }

/* desktop: tabuleiro à esquerda, painel à direita (centralizado na altura do tabuleiro) */
@media (min-width:880px){
  :root{--bw:max(340px, min(640px, calc(100dvh - 132px), calc(100vw - 500px)))}
  .game{min-height:0;grid-template-columns:auto minmax(320px,380px);grid-template-rows:auto 1fr auto auto auto 1fr;grid-template-areas:"bar bar" "board ." "board mascot" "board tools" "board pad" "board .";justify-content:center;column-gap:34px;row-gap:16px}
  .board-wrap{align-self:start}
  #mascot,.tools,.pad{width:100%}
  #mascot .bg-bubble{flex:none;height:120px;min-height:0;max-height:none;padding:10px 15px}
  #mascot .bg-bubble p{max-height:100%}
  #mascot .bg-bubble p{font-size:15.5px;line-height:1.3}
  #mascot .bg-bubble p.long{font-size:14px;line-height:1.28}
  .pad{grid-template-columns:repeat(3,1fr);gap:10px}
  .num{height:clamp(64px, calc((100dvh - 470px) / 3), 84px);font-size:34px;box-shadow:0 4px 0 var(--ink)}
  .num small{font-size:13px;right:8px;bottom:6px}
  .pad.notes-mode .num{font-size:26px}
  .tool{height:60px;gap:4px;font-size:14px}
  .status .timer{font-size:20px}
}

/* modal extras */
.diffs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.diff{text-align:left;padding:11px 14px 11px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-left-width:12px;border-left-color:var(--c)}
.diff b{font-family:var(--chunky);font-weight:400;font-size:20px}
.diff span{grid-column:1;font-size:13.5px;font-weight:700;color:#4b3d6b;line-height:1.3;font-family:var(--body)}
.diff em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--chunky);font-size:12px;color:#6b5a90;text-align:right;line-height:1.2}
.diff.cur{background:#FFF1B8}
.xprows{margin-top:14px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.xprow{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;font-size:14px;font-weight:800;border-bottom:1.5px dashed #d9cdef}
.xprow b{font-family:var(--chunky);font-weight:400;font-variant-numeric:tabular-nums;color:#0B8A81}
.xprow b.neg{color:var(--red)}
.xprow.total{background:var(--sun);border-bottom:0;font-family:var(--chunky);font-weight:400;font-size:17px}
.xprow.total b{color:var(--ink)}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ach{display:flex;gap:9px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px}
.ach .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sun);border:2.5px solid var(--ink)}
.ach .ic svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ach b{display:block;font-family:var(--chunky);font-weight:400;font-size:14px;line-height:1.15}
.ach small{display:block;font-size:12px;font-weight:700;color:#6b5a90;line-height:1.25}
.ach.locked{background:#eee7f7;border-style:dashed}
.ach.locked .ic{background:#d6cbe9}
.ach.locked b{color:#6f5f92}
.stat-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.bg-card .stat span{font-size:12px;letter-spacing:.02em;line-height:1.2;display:block}
.besttimes{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-weight:800}
.besttimes b{font-family:var(--chunky);font-weight:400;font-variant-numeric:tabular-nums}
/* ajuda: etiquetas com a mesma largura, pra os textos começarem todos na mesma linha */
.help-list li{align-items:flex-start}
.help-list .tag2{min-width:86px;text-align:center;margin-top:2px}
@media (max-width:380px){ .help-list .tag2{min-width:78px;padding-inline:4px} }
</style>
</head>
<body>
<div class="wrap game">
  <header id="bar"></header>
  <div id="mascot"></div>

  <section class="board-wrap" id="boardWrap">
    <div class="status">
      <span class="chip" id="diffChip">Bebê</span>
      <span class="timer" id="timer">00:00</span>
      <span class="combo" id="combo" hidden>x2</span>
      <span class="hearts" id="hearts" aria-label="Vidas"></span>
    </div>
    <div class="board" id="board" role="grid" aria-label="Grade do sudoku"></div>
    <div class="paused-veil" id="veil" hidden>PAUSADO<small>cochilei aqui, toca pra voltar</small></div>
    <div class="burst" id="burst" aria-hidden="true"></div>
  </section>

  <div class="tools">
    <button class="btn tool" id="tUndo" type="button" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Desfazer</span></button>
    <button class="btn tool" id="tErase" type="button" aria-label="Apagar"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span>Apagar</span></button>
    <button class="btn tool" id="tNotes" type="button" aria-pressed="false" aria-label="Lápis"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg><span>Lápis</span><b class="tag" id="notesTag">OFF</b></button>
    <button class="btn tool hint" id="tHint" type="button" aria-label="Dica"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><span>Dica</span><b class="tag" id="hintTag" hidden>0</b></button>
  </div>

  <div class="pad" id="pad"></div>
</div>

<script src="../shared/falas.js?v=2609242000"></script>
<script src="../shared/bugado.js?v=2609242000"></script>
<script src="falas-sudoku.js?v=2609242000"></script>
<script>
(() => {
const B = Bugado, $ = s => document.querySelector(s), RM = B.RM;
let RAND = Math.random; // trocado por um gerador com semente no Sudoku do Dia
const shuffle = a => B.shuffle(a, RAND);
const fmt = B.fmtTime;

/* ================= geometria ================= */
const UNITS = [], UNIT_OF = Array.from({length:81}, () => []);
for (let r=0;r<9;r++) UNITS.push(Array.from({length:9}, (_,c) => r*9+c));
for (let c=0;c<9;c++) UNITS.push(Array.from({length:9}, (_,r) => r*9+c));
for (let b=0;b<9;b++){ const br=Math.floor(b/3)*3, bc=(b%3)*3; UNITS.push(Array.from({length:9}, (_,k) => (br+Math.floor(k/3))*9 + bc + k%3)); }
UNITS.forEach((u,ui) => u.forEach(i => UNIT_OF[i].push(ui)));
const PEERS = Array.from({length:81}, (_,i) => { const s=new Set(); UNIT_OF[i].forEach(ui => UNITS[ui].forEach(j => { if (j!==i) s.add(j); })); return [...s]; });
const PEERSET = PEERS.map(p => new Set(p));
const pc = m => { let c=0; while(m){ m&=m-1; c++; } return c; };
const digitsOf = m => { const a=[]; for (let d=1;d<=9;d++) if (m>>d&1) a.push(d); return a; };
const cand = (g,i) => { let m=0; for (const p of PEERS[i]) m |= 1<<g[p]; return ~m & 0x3FE; };

/* ================= gerador ================= */
function solveRand(g){
  let best=-1, bm=0, bc=10;
  for (let i=0;i<81;i++) if (!g[i]){ const m=cand(g,i), c=pc(m); if (c<bc){ bc=c; best=i; bm=m; if (!c) return false; } }
  if (best<0) return true;
  for (const d of shuffle(digitsOf(bm))){ g[best]=d; if (solveRand(g)) return true; }
  g[best]=0; return false;
}
function countSol(g, limit=2){
  let n=0;
  (function rec(){
    if (n>=limit) return;
    let best=-1, bm=0, bc=10;
    for (let i=0;i<81;i++) if (!g[i]){ const m=cand(g,i), c=pc(m); if (c<bc){ bc=c; best=i; bm=m; if (!c) return; } }
    if (best<0){ n++; return; }
    for (const d of digitsOf(bm)){ g[best]=d; rec(); if (n>=limit) break; }
    g[best]=0;
  })();
  return n;
}
function solveSingles(g0){
  const g=g0.slice(); let progress=true;
  while (progress){
    progress=false;
    for (let i=0;i<81;i++) if (!g[i]){ const m=cand(g,i); if (!m) return false; if (pc(m)===1){ g[i]=digitsOf(m)[0]; progress=true; } }
    for (const u of UNITS){
      for (let d=1;d<=9;d++){
        if (u.some(j => g[j]===d)) continue;
        const spots = u.filter(j => !g[j] && (cand(g,j)>>d&1));
        if (!spots.length) return false;
        if (spots.length===1){ g[spots[0]]=d; progress=true; }
      }
    }
  }
  return g.every(v => v);
}
function generate(key, seed){
  RAND = seed == null ? Math.random : B.rng(seed);
  try { return generateWith(key); } finally { RAND = Math.random; }
}
function generateWith(key){
  const D=DIFFS[key]; const sol=Array(81).fill(0); solveRand(sol);
  const p=sol.slice(); let givens=81;
  for (const i of shuffle([...Array(41).keys()])){
    if (givens<=D.givens) break;
    const j=80-i, a=p[i], b=p[j]; p[i]=0; p[j]=0;
    const ok = D.mode==='singles' ? solveSingles(p) : countSol(p.slice())===1;
    if (ok) givens -= (i===j ? 1 : 2); else { p[i]=a; p[j]=b; }
  }
  return { puzzle:p, solution:sol };
}

/* ================= conteúdo ================= */
const DIFFS = {
  bebe:      { name:'Bebê',          givens:44, mode:'singles', xp:40,  par:360,  color:'#2EE6D6', desc:'Quase tudo já vem preenchido. Bom pra aprender, difícil errar.' },
  normal:    { name:'Normal',        givens:36, mode:'singles', xp:70,  par:660,  color:'#FFD23F', desc:'Sudoku de verdade, sem rodinha. Os 2 truques da ajuda resolvem.' },
  achando:   { name:'Tô Me Achando', givens:30, mode:'singles', xp:110, par:1020, color:'#FF4F9A', desc:'Pouca pista. Pra quem ganhou duas e já tá se achando.' },
  sofrencia: { name:'Sofrência',     givens:25, mode:'unique',  xp:180, par:1800, color:'#FF3B3B', desc:'Quase nada preenchido, vai precisar de lápis e paciência. Cê não tá pronto mas vai né' }
};
const ACH = [
  ['first','Nasceu','Ganhou a primeira. Bem-vindo à resenha.'],
  ['clean','Zero Vergonha','Ganhou sem errar nenhuma vez.'],
  ['nohint','Orgulho Próprio','Ganhou sem pedir dica.'],
  ['combo5','Tá Possuído','Fez combo x5.'],
  ['combo15','Modo Anime','Fez combo x15. Cadê a música de abertura?'],
  ['fast','Speedrun de Padaria','Ganhou em menos de 6 minutos.'],
  ['streak3','Viciado','Ganhou 3 dias seguidos.'],
  ['night','Vai Dormir Mano','Jogou entre meia-noite e 5 da manhã.'],
  ['normal','Tirou a Rodinha','Ganhou no Normal ou mais difícil.'],
  ['hard','Sofredor Certificado','Ganhou na Sofrência.'],
  ['phoenix','Renasceu das Cinzas','Perdeu, continuou e ganhou mesmo assim.'],
  ['ten','Isso Tem Nome: Vício','10 vitórias no Sudoku.']
];
const heartSVG = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/><path class="crack" d="M12 7.5 10 11l3 2-2 4" stroke-width="2"/></svg>';

/* ================= estado ================= */
let S = null;
const G = B.game('sudoku');
G.best = G.best || {}; G.ach = G.ach || {}; G.wins = G.wins || 0; G.played = G.played || 0;
const validGame = g => g && Array.isArray(g.board) && g.board.length===81 && Array.isArray(g.solution) && DIFFS[g.diff];
const save = () => { B.store.set('bugado.game', S); B.saveProfile(); };

/* ================= DOM ================= */
const boardEl = $('#board'), cells = [];
for (let b=0;b<9;b++){
  const box = document.createElement('div'); box.className='box';
  for (const i of UNITS[18+b]){
    const el = document.createElement('button');
    el.type='button'; el.className='cell'; el.dataset.i=i; el.setAttribute('role','gridcell');
    el.setAttribute('aria-label', `Linha ${Math.floor(i/9)+1}, coluna ${i%9+1}`);
    box.appendChild(el); cells[i]=el;
  }
  boardEl.appendChild(box);
}
const padEl = $('#pad'), padBtns = [];
for (let d=1; d<=9; d++){
  const b = document.createElement('button'); b.type='button'; b.className='btn num'; b.dataset.d=d;
  b.innerHTML = `${d}<small></small>`; padEl.appendChild(b); padBtns[d]=b;
}

/* ================= render ================= */
function render(){
  const sel = S.sel, selVal = sel>=0 ? S.board[sel] : 0;
  for (let i=0;i<81;i++){
    const el = cells[i], v = S.board[i];
    let cls = 'cell';
    if (S.puzzle[i]) cls += ' given'; else if (v) cls += S.hinted.includes(i) ? ' user hinted' : ' user';
    if (sel>=0 && i!==sel && PEERSET[sel].has(i)) cls += ' peer';
    if (selVal && v===selVal && i!==sel) cls += ' same';
    if (i===sel) cls += ' sel';
    let content;
    if (S.wrong && S.wrong.i===i){ cls += ' err'; content = String(S.wrong.d); }
    else if (v) content = String(v);
    else if (S.notes[i]){
      content = '<span class="notes">';
      for (let n=1;n<=9;n++){ const has = S.notes[i]>>n&1; content += `<i class="${has && n===selVal ? 'hl' : ''}">${has ? n : ''}</i>`; }
      content += '</span>';
    } else content = '';
    if (el.className !== cls) el.className = cls;
    if (el._c !== content){ el.innerHTML = content; el._c = content; }
  }
  const counts = Array(10).fill(0); S.board.forEach(v => counts[v]++);
  for (let d=1; d<=9; d++){ const left = 9-counts[d]; padBtns[d].classList.toggle('done', left===0); padBtns[d].querySelector('small').textContent = left || ''; padBtns[d].setAttribute('aria-label', `${d}, faltam ${left}`); }
  padEl.classList.toggle('notes-mode', S.notesMode);
  $('#tNotes').classList.toggle('on', S.notesMode); $('#tNotes').setAttribute('aria-pressed', S.notesMode);
  $('#notesTag').textContent = S.notesMode ? 'ON' : 'OFF';
  const ht = $('#hintTag'); ht.hidden = !S.hints; ht.textContent = S.hints;
  const D = DIFFS[S.diff], chip = $('#diffChip'); chip.textContent = S.daily != null ? `Do Dia #${S.daily}` : D.name; chip.style.setProperty('--c', S.daily != null ? '#FFD23F' : D.color);
  $('#timer').textContent = fmt(S.time);
  const cb = $('#combo'); cb.hidden = S.combo<2; cb.textContent = `x${S.combo}`;
  $('#hearts').innerHTML = [0,1,2].map(k => `<span class="${k < 3-S.mistakes ? '' : 'lost'}">${heartSVG}</span>`).join('');
}

/* ================= efeitos ================= */
const burstEl = $('#burst'), wrapEl = $('#boardWrap');
const burst = (t, c) => B.burst(burstEl, t, c);
function floatXP(i, text){
  const r = cells[i].getBoundingClientRect(), w = wrapEl.getBoundingClientRect();
  const s = document.createElement('span'); s.className='floatxp'; s.textContent=text;
  s.style.left = (r.left - w.left + r.width/2)+'px'; s.style.top = (r.top - w.top + r.height/2)+'px';
  wrapEl.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:'translate(-50%,-190%) scale(1.1)',opacity:1,offset:.6},{transform:'translate(-50%,-260%)',opacity:0}], {duration:900, easing:'ease-out'}).onfinish = () => s.remove();
}
const pop = i => { if (!RM) cells[i].animate([{transform:'scale(1.4)'},{transform:'scale(1)'}], {duration:280, easing:'cubic-bezier(.3,1.7,.5,1)'}); };
const shake = () => { if (!RM) boardEl.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}], {duration:360}); };
function flashCells(list, origin){
  const oR = Math.floor(origin/9), oC = origin%9;
  list.slice().sort((a,b) => (Math.abs(Math.floor(a/9)-oR)+Math.abs(a%9-oC)) - (Math.abs(Math.floor(b/9)-oR)+Math.abs(b%9-oC)))
    .forEach((i,k) => cells[i].animate([{backgroundColor:'#FFD23F',transform:'scale(1.15)'},{backgroundColor:'#2EE6D6',transform:'scale(1)',offset:.5},{backgroundColor:'#FFF7E6'}], {duration:600, delay:RM?0:k*38, easing:'ease-out'}));
}

/* ================= lógica ================= */
let lastPlace = Date.now(), notesAdded = 0, undos = 0, paused = false;
const talk = (cat, vars, m, hold) => B.talk(cat, vars, m, hold);

function newGame(key, quiet, daily){
  const day = B.dayNumber();
  if (daily) key = 'normal';
  const { puzzle, solution } = generate(key, daily ? 7000 + day : null);
  S = { diff:key, puzzle, solution, board:puzzle.slice(), notes:Array(81).fill(0), hinted:[], scored:Array(81).fill(false),
        time:0, mistakes:0, hints:0, combo:0, maxCombo:0, xpGain:0, history:[], sel:-1, notesMode:false,
        over:false, won:false, continued:false, wrong:null, milestones:{}, daily: daily ? day : null };
  S.sel = puzzle[40] ? puzzle.findIndex(v => !v) : 40;
  if (!daily) G.lastDiff = key;
  G.played++;
  if (new Date().getHours() < 5) unlock('night');
  notesAdded = 0; undos = 0; lastPlace = Date.now(); setPaused(false);
  save(); render();
  if (daily){ talk('sdDaily', {n:day}, 'smug', 6000); burst('DO DIA!', '#FFD23F'); }
  else if (!quiet){ sayStart(key); burst('VALENDO!', DIFFS[key].color); }
}
// abertura + comentário da dificuldade, cada um numa linha do balão
const sayStart = key => B.say(B.line('sdStart') + '<br>' + B.line('sdDiff_' + key), 'smug', 6000);
function unlock(id){
  if (G.ach[id]) return false;
  G.ach[id] = Date.now(); B.saveProfile(); const a = ACH.find(x => x[0]===id);
  B.toast(`Conquista: ${a[1]}`, a[2]); return true;
}
function pushHistory(){ S.history.push({ b:S.board.slice(), n:S.notes.slice(), h:S.hinted.slice() }); if (S.history.length>60) S.history.shift(); }
function select(i){ if (i===S.sel) return; S.sel=i; B.sfx.tap(); render(); }
const busy = () => !S || S.over || S.won;

function input(d){
  if (busy()) return;
  if (paused) setPaused(false);
  const i = S.sel;
  if (i<0){ talk('sdNoCell', null, 'smug'); return; }
  if (S.puzzle[i]){ talk('sdGiven', null, 'smug'); B.glitch(); return; }
  if (S.board[i]){ talk('sdLocked', null, 'smug'); return; }
  if (S.notesMode){
    pushHistory(); S.notes[i] ^= 1<<d; B.sfx.note(); render(); save();
    notesAdded++; if (notesAdded === 12 || notesAdded === 40 || notesAdded === 90) talk('sdNotesMany', {n:notesAdded}, 'smug');
    return;
  }
  if (d === S.solution[i]) placeCorrect(i, false);
  else mistake(i, d);
}

function placeCorrect(i, fromHint){
  pushHistory();
  const d = S.solution[i], now = Date.now(), gap = (now - lastPlace)/1000; lastPlace = now;
  S.board[i] = d; S.notes[i] = 0;
  for (const p of PEERS[i]) S.notes[p] &= ~(1<<d);
  if (fromHint) S.hinted.push(i);
  else {
    S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    if (S.combo>=5) unlock('combo5');
    if (S.combo>=15) unlock('combo15');
  }
  render(); pop(i);
  if (!fromHint) B.sfx.place(S.combo); else B.sfx.hint();

  let gain = 0;
  if (!fromHint && !S.scored[i]){ gain = 5 + 2*Math.min(S.combo-1, 10); S.scored[i] = true; }

  const names = ['LINHA FECHADA!','COLUNA FECHADA!','QUADRADO FECHADO!'], done = [];
  UNIT_OF[i].forEach((ui,k) => { if (UNITS[ui].every(j => S.board[j])) done.push([k, UNITS[ui]]); });
  const allDone = S.board.every(v => v);
  if (done.length && !allDone){
    const set = new Set(); done.forEach(([,u]) => u.forEach(j => set.add(j)));
    flashCells([...set], i); setTimeout(B.sfx.unit, 120);
    gain += 15*done.length;
    burst(done.length>1 ? 'COMBO DUPLO!' : names[done[0][0]], done.length>1 ? '#FF4F9A' : '#FFD23F');
  }
  if (gain){ floatXP(i, `+${gain}`); S.xpGain += gain; B.gainXP(gain); }
  if (allDone){ save(); return win(); }

  // o que o Bugado comenta?
  const empties = S.board.filter(v => !v).length, total = S.puzzle.filter(v => !v).length;
  const prog = 1 - empties/total, numLeft = 9 - S.board.filter(v => v===d).length;
  const ms = S.milestones;
  if (!fromHint){
    if ([3,5,8,12,16,20,25,30].includes(S.combo)){ talk('sdCombo', {n:S.combo}, 'happy'); if (!done.length) burst(`x${S.combo}!`, '#FF4F9A'); }
    else if (done.length > 1) talk('sdUnitMulti', null, 'happy');
    else if (done.length) talk('sdUnit', {tipo:['linha','coluna','quadrado'][done[0][0]]}, 'happy');
    else if (empties <= 5 && !ms.almost){ ms.almost = 1; talk('sdAlmost', {n:empties}, 'shock'); }
    else if (prog >= .75 && !ms.q3){ ms.q3 = 1; talk('sdThreeQ', null, 'smug'); }
    else if (prog >= .5 && !ms.half){ ms.half = 1; talk('sdHalf', null, 'talk'); }
    else if (prog >= .25 && !ms.q1){ ms.q1 = 1; talk('sdQuarter', null, 'talk'); }
    else if (!numLeft) talk('sdNumDone', {d}, 'smug');
    else if (gap < 2.5 && Math.random() < .35) talk('sdFast', null, 'shock');
    else if (gap > 60) talk('sdSlow', {s:Math.round(gap)}, 'smug');
    else if (Math.random() < .42) talk('sdCorrect', {d}, Math.random()<.5 ? 'smug' : 'talk');
  }
  save();
}

function mistake(i, d){
  const hadCombo = S.combo;
  S.mistakes++; S.combo = 0;
  S.wrong = { i, d }; render(); shake(); B.sfx.err(); B.glitch();
  const conflicts = PEERS[i].filter(p => S.board[p]===d);
  conflicts.forEach(p => cells[p].animate([{boxShadow:'inset 0 0 0 4px #FF3B3B',backgroundColor:'#FFD0D0'},{boxShadow:'inset 0 0 0 0 #FF3B3B'}], {duration:1100, easing:'ease-out'}));
  let cat;
  if (conflicts.length){ const p = conflicts[0]; cat = Math.floor(p/9)===Math.floor(i/9) ? 'sdWrongRow' : p%9===i%9 ? 'sdWrongCol' : 'sdWrongBox'; }
  else cat = 'sdWrongHidden';
  if (S.mistakes >= 3) cat = 'sdThirdMistake';
  else if (S.mistakes === 2) cat = Math.random() < .5 ? 'sdLastLife' : cat;
  else if (hadCombo >= 5) cat = 'sdComboBreak';
  B.talk(cat, {d:`<b>${d}</b>`, n:hadCombo}, 'shock', 3800);
  setTimeout(() => { S.wrong = null; render(); }, 850);
  if (S.mistakes >= 3){ S.over = true; setTimeout(gameOver, 900); }
  save();
}

function erase(){
  if (busy()) return;
  const i = S.sel; if (i<0) return;
  if (S.puzzle[i]){ talk('sdGiven', null, 'smug'); return; }
  if (S.board[i]){ talk('sdLocked', null, 'smug'); return; }
  if (S.notes[i]){ pushHistory(); S.notes[i]=0; B.sfx.note(); render(); save(); if (Math.random()<.3) talk('sdErase', null, 'smug'); }
  else talk('sdEraseEmpty', null, 'smug');
}
function undo(){
  if (busy()) return;
  const h = S.history.pop();
  if (!h){ talk('sdUndoNone', null, 'smug'); return; }
  S.board = h.b; S.notes = h.n; S.hinted = h.h; B.sfx.tap(); render(); save();
  undos++; if (undos === 1 || undos % 5 === 0 || Math.random() < .2) talk('sdUndo', {n:undos}, 'smug');
}
function toggleNotes(){
  if (busy()) return;
  S.notesMode = !S.notesMode; B.sfx.tap(); render(); save();
  talk(S.notesMode ? 'sdNotesOn' : 'sdNotesOff', null, 'talk', 3000);
}

function findHint(){
  const g = S.board, rc = i => `linha ${Math.floor(i/9)+1}, coluna ${i%9+1}`;
  const naked = i => { const d = digitsOf(cand(g,i))[0]; return { i, d, text:`Na ${rc(i)}, tirando o que já tem na linha, coluna e quadrado, só sobra o <b>${d}</b> (<b>candidato único</b>).` }; };
  const isNaked = i => !g[i] && pc(cand(g,i))===1;
  if (S.sel>=0 && isNaked(S.sel)) return naked(S.sel);
  const order = shuffle([...Array(81).keys()]);
  for (const i of order) if (isNaked(i)) return naked(i);
  for (const ui of shuffle([...Array(27).keys()])){
    const u = UNITS[ui];
    for (let d=1; d<=9; d++){
      if (u.some(j => g[j]===d)) continue;
      const spots = u.filter(j => !g[j] && (cand(g,j)>>d&1));
      if (spots.length===1){
        const where = ui<9 ? `Na linha ${ui+1}` : ui<18 ? `Na coluna ${ui-8}` : 'Nesse quadrado';
        return { i:spots[0], d, text:`${where}, o <b>${d}</b> só cabe aqui, o resto tá bloqueado (<b>único lugar</b>).` };
      }
    }
  }
  const i = (S.sel>=0 && !g[S.sel]) ? S.sel : order.find(j => !g[j]);
  return { i, d:S.solution[i], text:B.line('sdHintFallback') };
}
function hint(){
  if (busy()) return;
  const h = findHint(); if (!h || h.i==null) return;
  S.hints++; S.sel = h.i;
  const pre = S.hints===1 ? B.line('sdHint1') : S.hints===2 ? B.line('sdHint2') : B.line('sdHintMany', {n:S.hints});
  placeCorrect(h.i, true);
  if (!S.won) B.say(pre + ' ' + h.text, 'smug', 9000);
  cells[h.i].animate([{backgroundColor:'#2EE6D6',transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(1) rotate(0)'}], {duration:500, easing:'cubic-bezier(.3,1.6,.5,1)'});
}

function win(){
  S.won = true;
  const D = DIFFS[S.diff], rows = []; let total = 0;
  const add = (label, v) => { rows.push([label, v]); total += v; };
  add(`Vitória no ${D.name}`, D.xp);
  const tb = Math.max(0, Math.round((D.par - S.time)/D.par * D.xp * .6)); if (tb) add('Bônus de velocidade', tb);
  if (!S.mistakes && !S.continued) add('Zero erro', 30);
  if (!S.hints) add('Sem pedir dica', 25);
  if (S.maxCombo >= 5) add(`Combo máximo x${S.maxCombo}`, S.maxCombo*2);
  const officialDaily = S.daily === B.dayNumber() && !(G.lastDaily && G.lastDaily.day === S.daily && G.lastDaily.won);
  if (officialDaily){ add('Sudoku do Dia', 40); G.lastDaily = { day:S.daily, won:true, time:S.time, mistakes:S.mistakes, hints:S.hints }; }
  if (S.continued){ const pen = -Math.round(total/2); rows.push(['Taxa da vergonha (continuou)', pen]); total += pen; }
  const lvlBefore = B.levelInfo().lvl, earlier = S.xpGain;
  B.gainXP(total, {quiet:true});
  const lvlAfter = B.levelInfo().lvl;
  const streak = B.registerWin('sudoku'); G.wins = B.game('sudoku').wins;
  const prevBest = G.best[S.diff]; const record = !S.continued && (!prevBest || S.time < prevBest);
  if (record) G.best[S.diff] = S.time;
  const newAch = [], u = id => { if (unlock(id)) newAch.push(id); };
  u('first');
  if (!S.mistakes && !S.continued) u('clean');
  if (!S.hints) u('nohint');
  if (S.time < 360) u('fast');
  if (streak >= 3) u('streak3');
  if (S.diff !== 'bebe') u('normal');
  if (S.diff === 'sofrencia') u('hard');
  if (S.continued) u('phoenix');
  if (G.wins >= 10) u('ten');
  save(); render();

  flashCells([...Array(81).keys()], S.sel>=0 ? S.sel : 40);
  B.sfx.win(); B.confetti(); burst('ZEROU!', '#FFD23F');
  const cat = (!S.mistakes && !S.continued) ? 'sdWinClean' : !S.hints ? 'sdWinNoHint' : S.time < D.par/2 ? 'sdWinFast' : S.time > D.par*1.5 ? 'sdWinSlow' : 'sdWin';
  B.talk(cat, {tempo:fmt(S.time)}, 'happy', 99999);

  setTimeout(() => {
    B.openModal(`
      <h2 class="big">${!S.mistakes && !S.continued ? 'MDSSS ZERO ERRO' : S.continued ? 'ZEROU NO SUFOCO' : 'ZEROUUU'}</h2>
      <p class="sub">${B.line('vitoriaGeral')}</p>
      <div class="stat-grid four">
        <div class="stat"><b>${fmt(S.time)}</b><span>tempo</span></div>
        <div class="stat"><b>${S.continued ? 3 + S.mistakes : S.mistakes}</b><span>erros</span></div>
        <div class="stat"><b>${S.hints}</b><span>dicas</span></div>
        <div class="stat"><b>x${S.maxCombo}</b><span>combo</span></div>
      </div>
      <div class="badge-row">
        ${record ? '<span class="pill">RECORDE PESSOAL</span>' : ''}
        ${lvlAfter>lvlBefore ? `<span class="pill pink">NÍVEL ${lvlAfter}: ${B.titleOf(lvlAfter)}</span>` : ''}
        ${B.streakNow()>1 ? `<span class="pill sun">${B.streakNow()} DIAS SEGUIDOS</span>` : ''}
      </div>
      <div class="xprows">
        <div class="xprow"><span>XP no meio do jogo</span><b>+${earlier}</b></div>
        ${rows.map(([l,v]) => `<div class="xprow"><span>${l}</span><b class="${v<0?'neg':''}">${v<0?v:'+'+v}</b></div>`).join('')}
        <div class="xprow total"><span>Total</span><b>+${earlier+total} XP</b></div>
      </div>
      <div class="m-actions">
        ${S.daily != null ? '<button class="btn cool" type="button" data-act="share">Copiar resultado</button>' : ''}
        <button class="btn primary" type="button" data-act="again">Outra no ${D.name}</button>
        <button class="btn" type="button" data-act="menu">Trocar dificuldade</button>
      </div>
      ${newAch.length ? `<h3>Conquistas novas</h3><div class="achs">${newAch.map(achCard).join('')}</div>` : ''}`, {locked:true});
    if (lvlAfter > lvlBefore) B.sfx.lvl();
  }, RM ? 400 : 1500);
}

function gameOver(){
  B.sfx.lose(); B.mood('dead'); B.talk('sdOver', null, 'dead', 99999);
  B.openModal(`
    <h2>PERDEU PRA GRADE</h2>
    <p class="sub">${B.line('derrotaGeral')}</p>
    <p>3 erros. Os números certos continuam lá: dá pra continuar essa com os corações cheios (mas perde metade do bônus de vitória e eu vou lembrar pra sempre) ou começar outra do zero.</p>
    <div class="m-actions">

      <button class="btn" type="button" data-act="menu">Jogo novo</button>
    </div>`, {locked:true});
}

    <div class="besttimes">${Object.entries(DIFFS).map(([k,D]) => `<span>${D.name}</span><b>${G.best[k] ? fmt(G.best[k]) : '--:--'}</b>`).join('')}</div>
    <h3>Conquistas (${got}/${ACH.length})</h3>
    <div class="achs">${ACH.map(a => achCard(a[0])).join('')}</div>
    <div class="m-actions"><button class="btn primary" type="button" data-act="close">Fechar</button></div>`);
}
B.onAct('start', b => { B.closeModal(true); newGame(b.dataset.d); });
B.onAct('again', () => { B.closeModal(true); newGame(S.diff); });
B.onAct('daily', () => { B.closeModal(true); newGame('normal', false, true); });
B.onAct('share', async b => {
  const ok = await B.copyText(`Fliperama Bugado · Sudoku do Dia #${S.daily}\n🧩 ${fmt(S.time)} · ${S.mistakes} erro${S.mistakes===1?'':'s'} · ${S.hints} dica${S.hints===1?'':'s'}\n${location.href.split('?')[0]}`);
  b.textContent = ok ? 'Copiado!' : 'Não deu pra copiar';
});
B.onAct('menu', () => showNewGame());
B.onAct('continue', () => { B.closeModal(true); S.over=false; S.mistakes=0; S.continued=true; save(); render(); B.mood('neutral'); talk('sdCont', null, 'smug'); });

/* ================= pausa automática ================= */
function setPaused(on){
  paused = on; $('#veil').hidden = !on; $('#timer').classList.toggle('paused', on);
  if (on) B.mood('sleep');
}
$('#veil').addEventListener('click', () => { setPaused(false); talk('sdUnpause', null, 'talk'); });

/* ================= eventos ================= */
boardEl.addEventListener('click', e => { const c = e.target.closest('.cell'); if (c){ if (paused) setPaused(false); select(+c.dataset.i); } });
padEl.addEventListener('click', e => { const b = e.target.closest('.num'); if (b) input(+b.dataset.d); });
$('#tUndo').onclick = undo; $('#tErase').onclick = erase; $('#tNotes').onclick = toggleNotes; $('#tHint').onclick = hint;

document.addEventListener('keydown', e => {
  if (B.isModalOpen()) return;
  if (e.ctrlKey && (e.key==='z' || e.key==='Z')){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^[1-9]$/.test(k)){ input(+k); e.preventDefault(); return; }
  if (k==='Backspace' || k==='Delete' || k==='0'){ erase(); e.preventDefault(); return; }
  if (k==='n' || k==='N'){ toggleNotes(); return; }
  if (k==='z' || k==='Z'){ undo(); return; }
  if (k==='h' || k==='H'){ hint(); return; }
  const mv = { ArrowUp:-9, ArrowDown:9, ArrowLeft:-1, ArrowRight:1 }[k];
  if (mv && S){
    e.preventDefault(); if (paused) setPaused(false);
    let i = S.sel<0 ? 40 : S.sel, r = Math.floor(i/9), c = i%9;
    if (mv===-9) r=(r+8)%9; if (mv===9) r=(r+1)%9; if (mv===-1) c=(c+8)%9; if (mv===1) c=(c+1)%9;
    select(r*9+c); cells[r*9+c].focus({preventScroll:true});
  }
});

setInterval(() => {
  if (busy() || B.isModalOpen() || document.hidden || paused) return;
  if (Date.now() - B.idle.last > 60000){ setPaused(true); talk('sdPaused', null, 'sleep', 8000); return; }
  S.time++; $('#timer').textContent = fmt(S.time);
  if (S.time % 5 === 0) save();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });

/* ================= início ================= */
B.mountBar($('#bar'), { title:'Sudoku', color:'#2EE6D6', buttons:[
  { icon:'stats', label:'Estatísticas e conquistas', onClick:showStats },
  { icon:'help', label:'Como jogar', onClick: () => { $('#bHelp').classList.remove('pulse'); showHelp(); }, id:'bHelp' },
  { icon:'plus', label:'Novo jogo', onClick:showNewGame, cls:'sun' }
]});
B.mountMascot($('#mascot'), { pokeCat:'cutucarSudoku' });
const wide = matchMedia('(min-width:880px)');
const applyStack = () => B.setStack(wide.matches);
applyStack(); wide.addEventListener('change', applyStack);

const saved = B.store.get('bugado.game');
if (validGame(saved) && !saved.won){
  S = Object.assign({ hinted:[], scored:Array(81).fill(false), history:[], wrong:null, milestones:{} }, saved); S.wrong = null;
  render();
  if (S.over) gameOver(); else talk('sdBack', null, 'smug', 5000);
} else {
  newGame((saved && DIFFS[saved.diff] && saved.diff) || G.lastDiff || 'bebe', true);
  if (!B.profile().seen.sudoku){ B.say('oi, eu sou o <b>Bugado</b> e vou ficar aqui te zoando. Nunca jogou sudoku? Aperta o <b>?</b> lá em cima', 'talk', 7000); }
  else sayStart(S.diff);
}
if (!B.profile().seen.sudoku){ B.profile().seen.sudoku = true; B.saveProfile(); $('#bHelp').classList.add('pulse'); }
B.chatter({ active: () => !busy() && !paused, every:[55,100], idleAfter:35 });
})();
</script>
</body>
</html>
