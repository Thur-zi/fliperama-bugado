<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1650">
<title>Fliperama Bugado</title>
<meta name="description" content="Um fliperama de joguinhos diários com um mascote sarcástico que comenta tudo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="shared/base.css">
<style>
.hub{display:grid;gap:14px;grid-template-areas:"top" "mascot" "carts" "foot"}
.top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:.82;transform:rotate(-3deg);transform-origin:left center;user-select:none;margin-right:auto}
.logo .l1{font-family:var(--chunky);font-size:13px;letter-spacing:.3em;color:var(--cyan);padding-left:3px}
.logo .l2{font-family:var(--display);font-size:44px;letter-spacing:.04em;color:var(--sun);text-shadow:3px 3px 0 var(--pink),-2px -1px 0 var(--cyan);animation:glitch 7s infinite steps(1)}
@keyframes glitch{
  0%,93%,100%{transform:none;text-shadow:3px 3px 0 var(--pink),-2px -1px 0 var(--cyan)}
  94%{transform:translateX(3px) skewX(-8deg);text-shadow:-4px 0 0 var(--pink),4px 0 0 var(--cyan)}
  96%{transform:translateX(-2px);text-shadow:5px 2px 0 var(--pink),-5px -2px 0 var(--cyan)}
  98%{transform:translateX(1px) skewX(6deg)}
}
.top-btns{display:flex;gap:8px}

.me{display:flex;align-items:center;gap:10px;width:100%}
.badge{flex:none;width:50px;height:50px;border-radius:50%;background:var(--sun);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--pink);display:grid;place-items:center;font-family:var(--chunky);line-height:1;text-align:center}
.badge small{display:block;font-size:9px;letter-spacing:.12em}
.badge b{font-size:21px;font-weight:400}
.me-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.me-title{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.me-title span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{height:12px;border:2.5px solid var(--ink);border-radius:99px;background:var(--deep);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--cyan) 0 8px,#7DF5EA 8px 16px);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.streak{flex:none;display:flex;align-items:center;gap:4px;padding:4px 10px 4px 7px;border-radius:99px;background:var(--deep);border:2.5px solid var(--ink);font-family:var(--chunky);font-size:16px;color:var(--orange)}
.streak svg{width:18px;height:18px;fill:var(--orange);stroke:var(--ink);stroke-width:1.5}

#mascot{grid-area:mascot}
.carts{grid-area:carts;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sect{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:2px}
.sect h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.05em;color:var(--paper)}
.sect span{font-size:13px;color:var(--muted)}

/* cartucho */
.cart{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:18px 18px 12px 12px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s;overflow:hidden;min-width:0}
.cart:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:7px 9px 0 var(--ink)}
.cart:active{transform:translateY(2px);box-shadow:2px 2px 0 var(--ink)}
.cart .art{position:relative;height:108px;background:var(--c);border-bottom:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.cart .art::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(27,16,48,.14) 1.4px,transparent 1.7px);background-size:9px 9px}
.cart .art::after{content:"";position:absolute;top:8px;left:10px;right:10px;height:6px;border-radius:99px;background:repeating-linear-gradient(90deg,rgba(27,16,48,.35) 0 6px,transparent 6px 11px)}
.cart .art svg{position:relative;width:76px;height:76px;filter:drop-shadow(3px 3px 0 rgba(27,16,48,.9));transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.cart:hover .art svg{transform:scale(1.1) rotate(-5deg)}
.cart .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cart h3{margin:0;font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.04em;line-height:1}
.cart p{margin:0;font-size:12.5px;line-height:1.3;color:var(--text-ink);font-weight:700}
.cart .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.st{font-family:var(--chunky);font-size:11px;border:2px solid var(--ink);border-radius:99px;padding:1px 8px;background:#fff;white-space:nowrap}
.st.done{background:var(--green)}
.st.new{background:var(--sun);animation:blinky 1.6s ease-in-out infinite}
@keyframes blinky{50%{background:var(--pink)}}
.cart.locked{cursor:pointer;background:#e9e0f7}
.cart.locked .art{filter:grayscale(.55)}
.cart.locked .tape{position:absolute;top:44px;left:-12px;right:-12px;transform:rotate(-8deg);background:var(--sun);border-block:3px solid var(--ink);font-family:var(--display);font-size:20px;letter-spacing:.08em;text-align:center;padding:2px 0;z-index:2;background-image:repeating-linear-gradient(-45deg,transparent 0 12px,rgba(27,16,48,.12) 12px 24px)}

/* painel dos diários de hoje */
.daily{grid-column:1/-1;background:var(--deep);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--pink);padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px}
.daily-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.daily h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.05em;color:var(--sun)}
.daily-top b{font-family:var(--chunky);font-weight:400;font-size:28px;color:var(--paper);font-variant-numeric:tabular-nums;line-height:1}
.daily-top b small{font-size:16px;color:var(--muted)}
.daily-bar{display:flex;gap:5px}
.daily-bar .seg{flex:1;height:16px;border-radius:6px;border:2.5px solid var(--ink);background:#2b1a4d;transition:transform .15s}
.daily-bar .seg.on{background:var(--c);box-shadow:inset 0 -3px 0 rgba(27,16,48,.25)}
.daily-bar .seg:hover{transform:translateY(-2px)}
.daily p{margin:0;font-size:13px;color:var(--muted)}
.cart .novo{position:absolute;top:18px;right:8px;z-index:2;font-family:var(--display);font-size:17px;letter-spacing:.05em;color:var(--ink);background:var(--sun);border:2.5px solid var(--ink);border-radius:8px;padding:0 8px;transform:rotate(8deg);box-shadow:2px 2px 0 var(--ink);animation:novo 1.8s ease-in-out infinite}
@keyframes novo{50%{transform:rotate(8deg) scale(1.1)}}
.cart{position:relative}
.sect{margin-top:10px}
.foot-note{grid-area:foot;text-align:center;font-size:12px;color:var(--muted);padding-top:8px}
.foot-note button{background:none;border:0;color:var(--cyan);text-decoration:underline;cursor:pointer;font-weight:800;padding:0}

@media (min-width:700px){ .carts{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:980px){
  .hub{grid-template-columns:300px 1fr;grid-template-areas:"top top" "mascot carts" ". foot";column-gap:30px;align-items:start}
  #mascot{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .me{width:auto;min-width:360px}
  .cart .art{height:124px}
}
@media (max-width:380px){ .logo .l2{font-size:36px} .cart h3{font-size:22px} .cart .art{height:92px} .cart .art svg{width:64px;height:64px} }
</style>
</head>
<body>
<div class="wrap hub">
  <header class="top">
    <div class="logo" aria-label="Fliperama Bugado"><span class="l1">FLIPERAMA</span><span class="l2">BUGADO</span></div>
    <div class="top-btns">
      <button class="icon-btn" id="bSound" type="button"></button>
      <button class="icon-btn" id="bHelp" type="button" aria-label="O que é isso?" title="O que é isso?"></button>
    </div>
    <div class="me">
      <div class="badge"><div><small>NV</small><b id="lvlNum">1</b></div></div>
      <div class="me-info">
        <div class="me-title"><span id="lvlTitle">Estagiário do Fliperama</span><span id="lvlXp">0/120 XP</span></div>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <div class="streak" id="streak" title="Dias seguidos ganhando alguma coisa" hidden><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span id="streakN">0</span></div>
    </div>
  </header>

  <div id="mascot"></div>

  <main class="carts" id="carts"></main>

  <p class="foot-note">Feito com amor e muitos bugs. Progresso salvo neste navegador. · <button type="button" id="bReset">zerar tudo</button></p>
</div>

<script src="shared/falas.js"></script>

GAMES.find(g => g.id === 'sudoku').daily = true;

  hubDragonball: ['Dragon Ball! O poder de luta desse cartucho é mais de 8000!','Adivinha o guerreiro. Não é o Yamcha. A menos que seja. Coitado.','Vai jogar Dragon Ball? Grita “KAMEHAMEHA” antes pra dar sorte.','Tem Saiyajin, Namekuseijin, androide e o Mr. Satan. O maior de todos. Segundo ele.','Esse jogo demora menos que uma transformação no anime. Promessa.','Se o Kuririn aparecer, ele provavelmente vai morrer. É tradição.'],
  hubSoletra: ['Soletra! Sete letras, uma no meio que é obrigatória. A do meio é tipo aquele amigo que tem que ir junto em tudo.','Tem pangrama escondido na colmeia. Usa todas as letras. Eu não vou contar qual é.','Soletra é bom pra descobrir quantas palavras você NÃO conhece.','Colmeia de letras! Cuidado com as abelhas. Elas são metafóricas.','Quatro letras no mínimo. “Ai” não vale. Nem “ué”.','Vai lá virar Gênio Bugado. É o rank mais alto. Ninguém chegou. Mentira, sei lá.'],
  hubPonte: ['Ponte! Vai de uma palavra até outra pelo sentido. Tipo telefone sem fio, só que com lógica.','GATO até FOGUETE? Dá. Eu juro que dá. Eu testei. Não testei.','Cada palavra tem que ter a ver com a anterior. É construir ponte com palavras. Engenharia da conversa.','Ponte é o Contexto que foi pra faculdade de engenharia.','Tem “par” igual golfe. Se fizer abaixo do par, eu te chamo de Tiger Woods. Dos pixels.','Constrói a ponte direitinho. Se cair, a culpa é do engenheiro. Você.'],
  hubRelampago: ['Relâmpago! Silhueta, 60 segundos, quatro opções e zero calma.','Quem é esse Pokémon?! Em modo turbo. O Professor Carvalho ficaria nervoso.','60 segundos. Dá tempo de acertar uns 20. Ou de errar uns 20. Depende de você.','Relâmpago tem modo Dragon Ball também. Silhueta de guerreiro é mais difícil. Todo mundo tem cabelo espetado.','Combo aumenta o multiplicador. Errar zera. Igual a vida.','Esse aqui é pra quem assistia o anime só pela parte do “Quem é esse Pokémon?”.'],
  hubMaisoumenos: ['Mais ou Menos! O Snorlax pesa mais que o Onix? Pensa bem. Pensa MUITO bem.','Quem é mais pesado? Mais alto? Mais forte? É uma aula de Pokédex disfarçada de jogo.','Mais ou Menos é viciante. Eu avisei. Não diz que eu não avisei.','Você sabia que o Onix pesa 210 kg? E ele tem 8,8 metros. É praticamente um macarrão de pedra.','A sequência só acaba quando você erra. Ou seja: logo.','Tem modo Dragon Ball: quem é mais forte? O Mr. Satan sempre perde. Sempre.'],

function lineForTime(){ const h = new Date().getHours(); return h < 5 ? 'madrugada' : h < 12 ? 'manha' : h < 18 ? 'tarde' : 'noite'; }

function renderMe(){
  const li = B.levelInfo();
  document.getElementById('lvlNum').textContent = li.lvl;
  document.getElementById('lvlTitle').textContent = B.titleOf(li.lvl);
  document.getElementById('lvlXp').textContent = `${li.into}/${li.need} XP`;
  requestAnimationFrame(() => { document.getElementById('xpFill').style.width = Math.round(li.into/li.need*100) + '%'; });
  const s = B.streakNow(); document.getElementById('streak').hidden = !s; document.getElementById('streakN').textContent = s;
  const P = B.profile(), bs = document.getElementById('bSound');
  bs.innerHTML = P.sound ? B.ICON.on : B.ICON.off; bs.setAttribute('aria-label', P.sound ? 'Desligar som' : 'Ligar som'); bs.title = bs.getAttribute('aria-label');
}

function statusOf(g){
  const s = B.peekGame(g.id), day = B.dayNumber(), out = [];
  if (g.locked) return '<span class="st">em breve</span>';
  if (g.daily){ out.push(s.lastDaily && s.lastDaily.day === day ? `<span class="st done">diário ${s.lastDaily.won ? 'feito' : 'perdido'}</span>` : '<span class="st new">diário novo</span>'); }
  if (s.wins) out.push(`<span class="st">${s.wins} vitória${s.wins>1?'s':''}</span>`);
  else if (!g.daily) out.push('<span class="st">bora jogar</span>');
  return out.join('');
}

const dailyDone = () => { const day = B.dayNumber(); return GAMES.filter(g => g.daily && !g.locked && (B.peekGame(g.id).lastDaily || {}).day === day); };
function renderDaily(){
  const done = dailyDone(), total = GAMES.filter(g => g.daily && !g.locked).length, set = new Set(done.map(g => g.id));
  return `<div class="daily">
    <div class="daily-top"><h2>DIÁRIOS DE HOJE</h2><b>${done.length}<small>/${total}</small></b></div>
    <div class="daily-bar">${GAMES.filter(g => g.daily && !g.locked).map(g => `<a href="${g.href}" class="seg ${set.has(g.id)?'on':''}" style="--c:${g.color}" title="${g.name}${set.has(g.id)?' — feito':''}"></a>`).join('')}</div>
    <p>${done.length === total ? 'Zerou TODOS os diários. Vai tomar um sol. Sério.' : done.length ? `Faltam ${total-done.length}. O Bugado tá de olho.` : 'Nenhum feito ainda. Os desafios de hoje tão te esperando.'}</p>
  </div>`;
}
function cartHTML(g){
  return `
      <${g.locked ? 'button type="button"' : `a href="${g.href}"`} class="cart ${g.locked ? 'locked' : ''}" data-id="${g.id}" style="--c:${g.color}">
        <div class="art">${g.art}</div>
        ${!g.locked && !Object.keys(B.peekGame(g.id)).length ? '<span class="novo">NOVO!</span>' : ''}
        <div class="body">
          <h3>${g.name}</h3>
          <p>${g.tag}</p>
          <div class="foot">${statusOf(g)}</div>
        </div>
      </${g.locked ? 'button' : 'a'}>`;
}
function renderCarts(){
  const el = document.getElementById('carts'), byId = Object.fromEntries(GAMES.map(g => [g.id, g]));
  el.innerHTML = renderDaily() + SECTIONS.map(s => `<div class="sect"><h2>${s.title}</h2><span>${s.sub}</span></div>` + s.games.map(id => cartHTML(byId[id])).join('')).join('');
}
const CAT = { sudoku:'hubSudoku', termo:'hubTermo', conexo:'hubConexo', pokemon:'hubPokemon', dragonball:'hubDragonball', contexto:'hubContexto', soletra:'hubSoletra', ponte:'hubPonte', relampago:'hubRelampago', maisoumenos:'hubMaisoumenos', forca:'hubForca', memoria:'hubMemoria' };
let hoverTimer = null, lastHover = '';
const cartsEl = document.getElementById('carts');
cartsEl.addEventListener('pointerover', e => {
  const c = e.target.closest('.cart'); if (!c || c.dataset.id === lastHover) return;
  lastHover = c.dataset.id; clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => B.talk(CAT[c.dataset.id], null, 'smug', 4500), 350);
});
cartsEl.addEventListener('focusin', e => { const c = e.target.closest('.cart'); if (c && c.dataset.id !== lastHover){ lastHover = c.dataset.id; B.talk(CAT[c.dataset.id], null, 'smug', 4500); } });
cartsEl.addEventListener('click', e => {
  const c = e.target.closest('.cart'); if (!c) return;
  B.sfx.flip();
  if (c.classList.contains('locked')){ B.glitch(); B.talk('hubContexto', null, 'shock', 6000); }
});

document.getElementById('bSound').addEventListener('click', () => {
  const on = !B.profile().sound; B.setSound(on); renderMe();
  B.say(on ? 'Som ligado. Agora teus erros têm trilha sonora.' : 'Som desligado. Vergonha silenciosa.', 'smug', 3000);
});
document.getElementById('bHelp').innerHTML = B.ICON.help;
document.getElementById('bHelp').addEventListener('click', () => {
  B.sfx.tap(); document.getElementById('bHelp').classList.remove('pulse');
  B.openModal(`
    <h2>O que é isso aqui?</h2>
    <p class="sub">Um fliperama de joguinhos pra você jogar todo dia. E eu, o <b>Bugado</b>, comentando tudo. De graça. Infelizmente pra você.</p>
    <h3>Como funciona</h3>
    <ul>
      <li><span class="tag2" style="--c:#FFD23F">DIÁRIO</span><span>Termo, Conexo, Pokémon e Dragon Ball têm um desafio novo por dia, igual pra todo mundo. Depois dá pra jogar no modo infinito.</span></li>
      <li><span class="tag2" style="--c:#2EE6D6">XP</span><span>Tudo que você faz em qualquer jogo soma XP no mesmo nível. Os títulos vão de “Estagiário do Fliperama” até “Isso Não Existe”.</span></li>
      <li><span class="tag2" style="--c:#FF9A3C">FOGUINHO</span><span>Ganhou alguma coisa hoje e ontem? A sequência sobe. Pulou um dia? Zera. Sem choro.</span></li>
      <li><span class="tag2" style="--c:#FF4F9A">BUGADO</span><span>Eu falo muito. Tipo, muito. E quase nunca repito. Pode me cutucar também. Com moderação.</span></li>
    </ul>
    <p style="margin-top:14px">Tudo fica salvo neste navegador. Se jogar no celular e no PC, cada um tem seu progresso.</p>
    <div class="m-actions"><button class="btn primary" type="button" data-act="close">Bora jogar</button></div>`);
});
document.getElementById('bReset').addEventListener('click', () => {
  B.openModal(`
    <h2>Zerar TUDO?</h2>
    <p class="sub">XP, níveis, sequência, jogos salvos, estatísticas… tudo some deste navegador. Não tem volta. Nem com dica.</p>
    <div class="m-actions"><button class="btn hot" type="button" data-act="reset">Zerar mesmo</button><button class="btn" type="button" data-act="close">Não, pelo amor</button></div>`);
});
B.onAct('reset', () => {
  try { Object.keys(localStorage).filter(k => k.startsWith('fliperama.') || k.startsWith('bugado.')).forEach(k => localStorage.removeItem(k)); } catch(e){}
  location.reload();
});

B.mountMascot(document.getElementById('mascot'));
const wide = matchMedia('(min-width:980px)');
const applyStack = () => B.setStack(wide.matches);
applyStack(); wide.addEventListener('change', applyStack);

renderMe(); renderCarts();

// fala de chegada
const P = B.profile();
let first = false;
try { first = !sessionStorage.getItem('fliperama.hubSeen'); sessionStorage.setItem('fliperama.hubSeen', '1'); } catch(e){ first = true; }
if (!P.seen.hub){
  P.seen.hub = true; B.saveProfile();
  B.say('Bem-vindo ao <b>Fliperama Bugado</b>! Eu sou o Bugado. Antes eu morava só no sudoku, agora eu tenho um fliperama inteiro pra comentar. Escolhe um cartucho aí.', 'happy', 8000);
  document.getElementById('bHelp').classList.add('pulse');
} else if (first){
  const s = B.streakNow();
  B.say((s > 1 && Math.random() < .5) ? B.line('sequencia', {n:s}) : (Math.random() < .5 ? B.line(lineForTime()) : B.line('homeOi')), 'talk', 6000);
} else {
  B.talk('homeVoltou', null, 'smug', 5000);
}
B.chatter({ every:[35,70], idleAfter:45 });
window.addEventListener('pageshow', e => { if (e.persisted){ B.syncProfile(); renderMe(); renderCarts(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden){ B.syncProfile(); renderMe(); renderCarts(); } });
})();
</script>
